# Nome da Pipeline exibido na aba "Actions" do GitHub
name: Execucao de Testes - Robot Framework com Allure

# Define os gatilhos de disparo da pipeline
on:
  push:
    branches: [ "main", "master" ]       # Dispara ao fazer 'git push' nas branches principais
  pull_request:
    branches: [ "main", "master" ]       # Dispara ao abrir ou atualizar um Pull Request

# Permissões do token do GitHub para publicar o relatório no GitHub Pages
permissions:
  contents: read                         # Permissão para ler o código do repositório
  pages: write                           # Permissão para escrever e publicar no GitHub Pages
  id-token: write                        # Permissão para autenticar a publicação do Pages

# Evita execuções simultâneas conflitantes do deploy do GitHub Pages
concurrency:
  group: "pages"
  cancel-in-progress: false

# Definição dos trabalhos (tarefas) que a pipeline vai executar
jobs:
  # JOB 1: Execução dos testes e geração dos resultados do Allure
  testes:
    runs-on: ubuntu-latest               # Define o sistema operacional da maquina virtual (Linux)

    steps:
      # 1. Clona o código do seu repositório dentro da máquina virtual
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      # 2. Instala a versão especificada do Python na máquina virtual
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Instala o Java (O Allure Commandline precisa do Java para compilar os resultados)
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Instala o Google Chrome na máquina virtual para rodar os testes end-to-end
      - name: Instalar Google Chrome
        uses: browser-actions/setup-chrome@v1

      # 5. Instala o pip e todas as dependências listadas no seu arquivo requirements.txt
      - name: Instalar bibliotecas do Robot
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements.txt

      # 6. Executa a suíte de testes em modo Headless (sem janela gráfica) e injeta as credenciais das Secrets
      - name: Executar Testes em Headless com Allure
        env:
          USUARIO: ${{ secrets.USUARIO_PADRAO }}
          SENHA: ${{ secrets.SENHA_PADRAO }}
          USUARIO_BLOQUEADO: ${{ secrets.USUARIO_BLOQUEADO }}
        run: |
          robot -d ./results --listener allure_robotframework:./allure-results -v BROWSER:headlesschrome -v USUARIO_PADRAO:${{ env.USUARIO }} -v SENHA_PADRAO:${{ env.SENHA }} -v USUARIO_BLOQUEADO:${{ env.USUARIO_BLOQUEADO }} tests/
        continue-on-error: true                 # Garante que os próximos passos rodem mesmo se algum teste falhar

      # 7. Instala a CLI do Allure via npm e compila a pasta de relatórios HTML estática
      - name: Gerar Relatorio Allure
        if: always()                             # Executa mesmo se a etapa de testes falhar
        run: |
          npm install -g allure-commandline
          allure generate ./allure-results --clean -o ./allure-report

      # 8. Empacota a pasta ./allure-report e prepara para o envio ao GitHub Pages
      - name: Upload dos artefatos para o Pages
        if: always()                             # Executa mesmo se a etapa de testes falhar
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./allure-report

  # JOB 2: Publicação do relatório gerado no GitHub Pages
  deploy-pages:
    needs: testes                                # Depende da conclusão do job 'testes'
    if: always()                                 # Executa para atualizar o relatório mesmo se houver testes com falha
    runs-on: ubuntu-latest
    environment:
      name: github-pages                         # Nome do ambiente do GitHub Pages
      url: ${{ steps.deployment.outputs.page_url }}  # URL gerada para acessar o relatório online

    steps:
      # 9. Pega o artefato enviado no passo 8 e faz o deploy na URL do GitHub Pages
      - name: Publicar Allure Report no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4