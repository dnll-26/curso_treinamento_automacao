name: Execucao de Testes - Robot Framework com Allure

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# Permissões necessárias para publicar no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código do repositório
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      # 2. Configura o Python
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Instala o Java (Necessário para a CLI do Allure compilar o relatório)
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Instala o Google Chrome
      - name: Instalar Google Chrome
        uses: browser-actions/setup-chrome@v1

      # 5. Instala as dependências Python
      - name: Instalar bibliotecas do Robot
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements.txt

      # 6. Executa os testes gerando os resultados para o Allure (com --listener)
      - name: Executar Testes em Headless com Allure
        run: |
          robot -d ./results --listener allure_robotframework:./allure-results -v BROWSER:headlesschrome tests/
        continue-on-error: true

      # 7. Gera o Relatório HTML do Allure via CLI (evita erros de Docker e gera estrutura estática limpa)
      - name: Gerar Relatorio Allure
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate ./allure-results --clean -o ./allure-report

      # 8. Prepara os arquivos da pasta ./allure-report para o GitHub Pages
      - name: Upload dos artefatos para o Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./allure-report

  deploy-pages:
    needs: testes
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 9. Publica o Allure Report diretamente na URL do GitHub Pages
      - name: Publicar Allure Report no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4